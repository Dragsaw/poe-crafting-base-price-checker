# Runs the full gate on a pull request that changes code or the config that
# code builds with.
#
# The workflow starts on every pull request and the filter step skips the rest
# when nothing relevant changed. A `paths:` trigger would skip the whole run, and
# a required check that never reports leaves the pull request unmergeable.
#
# `pnpm check` is the done gate of AGENT-WORKFLOW.md, the same command the
# pre-push hook runs. It includes `pnpm test:data`, which `deploy.yml` does not
# run, so a player's data-only push still deploys.
name: Tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes under a minute. A test that spins on resolved promises
    # starves Vitest's own timeout, so this is the only limit that stops it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mts'
              - '**/*.cts'
              - '**/*.mjs'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '**/tsconfig*.json'
              - 'eslint-suppressions.json'
              - 'knip.json'
              - '.jscpd.json'
              - '.githooks/**'
              - '.github/workflows/test.yml'

      # Reads the version from `packageManager` in package.json.
      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.changes.outputs.code == 'true'
        run: pnpm check
