packages:
  - 'packages/*'

# pnpm >= 10 blocks dependency lifecycle scripts unless the dependency is named
# here. Nothing in `packages/*` has one; msw's postinstall only prints a notice.
allowBuilds:
  msw: true

# pnpm 12 gates freshly published versions behind a minimum release age. The
# spine pins these exactly, so the gate is waived per package rather than off.
minimumReleaseAgeExclude:
  - dependency-cruiser@18.4.0
  - eslint-plugin-unicorn@77.0.0
