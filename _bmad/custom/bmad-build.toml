[workflow]

persistent_facts = [
  "Before you triage, reject or fix any review finding, read the Review brief section of {project-root}/docs/architecture/architecture-poe-crafting-base-price-checker-2026-09-12/AGENT-WORKFLOW.md and apply it. It covers the Accessibility Floor ruling and the rule that a reviewer does not edit an owner document.",
]

activation_steps_prepend = [
  "Apply the MCP tool rule in AGENTS.md (Conventions that differ from defaults) for all code work.",
]

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> Read AGENTS.md at the project root. Apply its MCP tool rule for all code work.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
"""

on_complete = """
If the diff changed a file under packages/web/src/, offer the user one optional step. Run `/impeccable critique` on the changed surface, with `pnpm dev` and agent-browser in a named session (AGENTS.md). Then run `/impeccable polish` on the findings the user accepts. Apply the Review brief of AGENT-WORKFLOW.md to each finding. Do not start this step without a yes.
"""

# This layer stops a lost ledger entry. It runs in
# the review step. The review step always runs before this workflow's one
# commit (step-05-present.md's Commit and Complete, or step-oneshot.md's
# Commit). A finding from this layer gets fixed before that commit. The
# fix and the carved-out change land in the same commit.
#
# The dispatch layer reads `{claims_file}`. The oneshot layer reads
# `{spec_file}`. Both paths point at the spec under review.

[[workflow.review_layers]]
id = "deferred-ledger-audit"
name = "Deferred Ledger Auditor"
instruction = """
Launch a context-free subagent with this prompt:

You are a deferred-work ledger auditor.

Do this:

1. Read the spec at `{claims_file}` in full.
2. Find every carved-out item in the spec. A carved-out item is text that says the agent did not do some work here, put it off, or still owes it. Look in Implementation Notes, Design Notes, Open Questions decisions, the Spec Change Log, and the Review Triage Log.
3. Read `docs/stories/deferred-work.md` in full.
4. For each carved-out item, check `docs/stories/deferred-work.md` for a matching entry. A matching entry names this spec as its `source_spec` and states the same carved-out item. The wording may differ from the spec's wording. Treat an entry as a match when it names the same file, the same decision, or the same carved-out item. When you cannot tell if an entry matches, treat it as a match.
5. Report one finding for each carved-out item with no matching entry.

Each finding must:

- Name `docs/stories/deferred-work.md` as the file.
- State the carved-out item in one sentence.
- Give the entry `docs/stories/deferred-work.md` needs, in its format: `source_spec`, `summary`, `evidence`.
- State this warning: a carved-out item with no ledger entry is lost work. Story 1.7 lost a carved-out item this way. No one recorded the loss until a later, separate item caught it.

Output a Markdown list of findings. Output nothing else.

If every carved-out item has a matching entry, or the spec has no carved-out item, report zero findings. Say so.

Do not invoke any skill. Do not start any subagent of your own. You are the reviewer.

Return your findings as text in your final message. Do not send your findings through any findings-reporting tool the host may offer.

"""

