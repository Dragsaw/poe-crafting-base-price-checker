[[workflow.review_layers]]
id = "impeccable-design-review"
name = "Impeccable Design Reviewer"
when = "The diff changes a file under packages/web/src/ or a UX mockup."
instruction = """
Launch a context-free subagent with this prompt:

Read `{project-root}/_bmad/custom/prompts/impeccable-design-review.md` and follow it. The diff is at `{diff_file}`. The spec is at `{claims_file}`.
"""

[[workflow.oneshot_review_layers]]
id = "impeccable-design-review"
name = "Impeccable Design Reviewer"
when = "The changed files include a file under packages/web/src/ or a UX mockup."
instruction = """
Launch a context-free subagent with this prompt:

Read `{project-root}/_bmad/custom/prompts/impeccable-design-review.md` and follow it. Use the changed files in the current worktree. The spec is at `{spec_file}`.
"""
